<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>AYARA Barcode Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:auto;padding:18px}.top{font-size:22px;font-weight:800}.sub{font-size:13px;opacity:.75;margin-top:4px}
#reader{margin-top:18px;border-radius:14px;overflow:hidden;background:#000;min-height:360px}
#reader video{width:100%!important;border-radius:12px}
.info{margin-top:14px;padding:12px;border-radius:10px;background:#1f2937;text-align:center;font-size:14px;line-height:1.45}
.btn{display:block;width:100%;margin-top:10px;border:0;border-radius:10px;padding:13px;background:#c9a227;color:#fff;font-weight:700;font-size:15px}
.manual{display:flex;gap:8px;margin-top:12px}.manual input{flex:1;min-height:46px;border-radius:9px;border:1px solid #4b5563;padding:10px;font-size:16px}.manual button{min-width:100px;border:0;border-radius:9px;background:#fff;color:#111827;font-weight:700}
.small{font-size:11px;opacity:.6;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">AYARA FASHIONS</div>
  <div class="sub">Secure Barcode / QR Scanner</div>
  <div id="reader"></div>
  <div id="info" class="info">Allow camera access, then point the camera at the product barcode or QR code.</div>
  <div class="manual"><input id="manualCode" placeholder="Enter SKU / barcode"><button onclick="sendCode(document.getElementById('manualCode').value)">Use</button></div>
  <button class="btn" onclick="closeScanner()">Close Scanner</button>
  <div class="small">Camera access is used only on this scanner page. The scanned value is returned to AYARA POS.</div>
</div>
<script src="https://unpkg.com/html5-qrcode" crossorigin="anonymous"></script>
<script>
let scanner=null,done=false;
const info=document.getElementById('info');
const params=new URLSearchParams(location.search);
function setInfo(t){info.textContent=t}
function sendCode(v){
 const code=String(v||'').trim(); if(!code){setInfo('Enter a SKU or barcode.');return}
 if(done)return; done=true;
 try{if(scanner)scanner.stop().catch(()=>{});}catch(e){}
 if(window.opener && !window.opener.closed){
   window.opener.postMessage({type:'AYARA_SCAN',code:code,target:params.get('target')||'sale'},'*');
   setInfo('Scanned: '+code+'\nReturning to AYARA POS…');
   setTimeout(()=>window.close(),350);
 }else{
   setInfo('Scanned: '+code+'. Return to AYARA POS and enter this value manually: '+code);
   done=false;
 }
}
function closeScanner(){try{if(scanner)scanner.stop().catch(()=>{});}catch(e){}window.close()}
function start(){
 if(typeof Html5Qrcode==='undefined'){setInfo('Scanner library could not load. Check internet access, then reload.');return}
 scanner=new Html5Qrcode('reader');
 scanner.start(
   {facingMode:'environment'},
   {fps:10,qrbox:{width:260,height:160},aspectRatio:1.5},
   text=>sendCode(text),
   ()=>{}
 ).then(()=>setInfo('Camera ready. Point it at a barcode or QR code.'))
 .catch(e=>setInfo('Camera could not start. Allow camera permission in Chrome and reload this page.'));
}
window.addEventListener('load',()=>setTimeout(start,250));
</script>
</body>
</html>
