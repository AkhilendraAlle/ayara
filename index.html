<!doctype html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>AYARA Barcode Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:620px;margin:auto;padding:16px}.top{font-size:22px;font-weight:800}.sub{font-size:13px;opacity:.75;margin-top:4px}.reader{margin-top:16px;border-radius:14px;overflow:hidden;background:#000;min-height:340px;position:relative}.reader video{width:100%!important;display:block}.status{padding:12px;border-radius:10px;background:#1f2937;margin-top:12px;text-align:center;white-space:pre-line;font-size:14px}.btn{width:100%;margin-top:10px;border:0;border-radius:10px;padding:13px;background:#c9a227;color:#fff;font-weight:700;font-size:15px}.manual{display:flex;gap:8px;margin-top:10px}.manual input{flex:1;min-height:46px;border-radius:9px;border:1px solid #4b5563;padding:10px;font-size:16px}.manual button{min-width:100px;border:0;border-radius:9px;background:#fff;color:#111827;font-weight:700}.small{font-size:11px;opacity:.65;margin-top:12px;text-align:center}.hide{display:none!important}
</style></head><body><div class="wrap">
<div class="top">AYARA FASHIONS</div><div class="sub">Barcode / QR Scanner</div>
<div id="reader" class="reader"></div>
<div id="status" class="status">Tap “Start Camera”, then allow camera access.</div>
<button id="startBtn" class="btn" onclick="startCamera()">📷 Start Camera</button>
<div class="manual"><input id="manualCode" placeholder="Enter SKU / barcode"><button onclick="sendCode(document.getElementById('manualCode').value)">Use</button></div><button class="btn" onclick="copyCode()">📋 Copy Scanned Value</button>
<button class="btn" onclick="closeScanner()">Close</button>
<div class="small">Use the scanner from the AYARA POS button. Camera access requires HTTPS and browser permission.</div>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let scanner=null,done=false,starting=false;const status=document.getElementById('status');const params=new URLSearchParams(location.search);const target=params.get('target')||'sale';const returnUrl=params.get('return')||'';
function msg(t){status.textContent=t}
function normalise(v){const raw=String(v||'').trim();if(!raw)return '';try{if(/^https?:\/\//i.test(raw)){const u=new URL(raw);return u.searchParams.get('sku')||u.searchParams.get('barcode')||u.searchParams.get('code')||raw}}catch(e){}return raw}
function sendCode(v){const code=normalise(v);if(!code){msg('Enter a SKU or barcode.');return}if(done)return;done=true;try{if(scanner)scanner.stop().catch(()=>{})}catch(e){}
 msg('Scanned: '+code+'\nSending to AYARA POS…');
 try{if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'AYARA_SCAN',code,target},'*');setTimeout(()=>window.close(),700);return}}catch(e){}
 if(returnUrl){try{const u=new URL(returnUrl);u.searchParams.set('ayara_scan',code);u.searchParams.set('scan_target',target);window.location.href=u.toString();return}catch(e){}}
 const inp=document.getElementById('manualCode');inp.value=code;inp.select();navigator.clipboard?.writeText(code).catch(()=>{});msg('Scanned: '+code+'\nThe value has been copied. Return to AYARA POS.');done=false}
async function startCamera(){if(starting||scanner)return;starting=true;document.getElementById('startBtn').disabled=true;msg('Requesting camera permission…');
 if(!window.isSecureContext){msg('Camera requires HTTPS. Open the GitHub Pages HTTPS address, not a file:// URL.');starting=false;document.getElementById('startBtn').disabled=false;return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('This browser does not expose camera access. Use current Chrome on Android/iPhone.');starting=false;document.getElementById('startBtn').disabled=false;return}
 try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});stream.getTracks().forEach(t=>t.stop())}catch(e){msg('Camera permission was denied or unavailable.\nIn Chrome, open site settings → Camera → Allow, then reload and tap Start Camera.');starting=false;document.getElementById('startBtn').disabled=false;return}
 if(typeof Html5Qrcode==='undefined'){msg('Scanner library did not load. Check internet access and reload.');starting=false;document.getElementById('startBtn').disabled=false;return}
 scanner=new Html5Qrcode('reader');
 try{await scanner.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.min(300,Math.floor(w*.82)),height:Math.min(180,Math.floor(h*.42))}),formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E]},text=>sendCode(text),()=>{});msg('Camera ready. Point it at the barcode or QR code.')}catch(e){try{await scanner.clear()}catch(x){}scanner=null;msg('Camera opened but the scanner could not start. Try Chrome, allow camera permission, and reload.');document.getElementById('startBtn').disabled=false}finally{starting=false}}
function copyCode(){const v=document.getElementById('manualCode').value.trim();if(!v)return;navigator.clipboard?.writeText(v).then(()=>msg('Copied: '+v)).catch(()=>{document.getElementById('manualCode').select();document.execCommand('copy');msg('Copied: '+v)})}
function closeScanner(){try{if(scanner)scanner.stop().catch(()=>{})}catch(e){}window.close()}
window.addEventListener('pagehide',()=>{try{if(scanner)scanner.stop().catch(()=>{})}catch(e){}});
</script></body></html>
