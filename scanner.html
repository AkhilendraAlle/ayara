<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061a52">
  <title>Ayara QR / Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#061a52;color:#fff;min-height:100vh}
    .wrap{max-width:560px;margin:auto;padding:18px}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .brand img{width:52px;height:52px;object-fit:cover;border-radius:9px}
    h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.75}
    .card{background:#fff;color:#172033;border-radius:16px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
    #reader{width:100%;overflow:hidden;border-radius:12px}
    #reader video{width:100%!important;border-radius:12px}
    .status{margin-top:10px;padding:11px;border-radius:9px;background:#eef2f9;color:#24304a;font-size:13px}
    .error{background:#fff0f0;color:#a51e1e}
    button{width:100%;padding:12px;border-radius:10px;border:0;margin-top:10px;font-weight:750;cursor:pointer}
    .primary{background:#061a52;color:#fff}.light{background:#e9edf5;color:#172033}
    .result{display:none;margin-top:12px;padding:14px;background:#eaf8ef;color:#126b3b;border-radius:10px;font-weight:700}
    .manual{display:flex;gap:8px;margin-top:10px}.manual input{flex:1;padding:11px;border:1px solid #dbe1eb;border-radius:9px}
    .manual button{width:auto;margin:0}
    .hint{font-size:11px;color:#687086;margin-top:10px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img id="logo">
    <div><h1>AYARA FASHIONS</h1><div class="sub">QR / Barcode Scanner</div></div>
  </div>

  <div class="card">
    <div id="reader"></div>
    <div id="status" class="status">Starting camera… Please allow camera access when your browser asks.</div>
    <div id="result" class="result"></div>

    <button class="light" onclick="startCamera()">↻ Restart Camera</button>

    <div class="manual">
      <input id="manual" placeholder="Enter barcode / QR value manually">
      <button class="primary" onclick="sendCode(document.getElementById('manual').value)">Use</button>
    </div>

    <div class="hint">
      Camera scanning requires HTTPS. If your browser blocks the camera, allow Camera permission for this scanner site and restart.
    </div>
  </div>
</div>

document.getElementById('logo').src = LOGO;

let scanner = null;
let sending = false;

function setStatus(text,error=false){
  const el=document.getElementById('status');
  el.textContent=text;
  el.className='status'+(error?' error':'');
}

function sendCode(value){
  if(sending) return;
  const code=String(value||'').trim();
  if(!code){setStatus('Please enter a code.',true);return;}
  sending=true;
  document.getElementById('result').style.display='block';
  document.getElementById('result').textContent='Scanned: '+code;
  setStatus('Code captured. Returning to Ayara POS…');

  try{
    if(window.opener && !window.opener.closed){
      window.opener.postMessage({source:'AYARA_SCANNER',code:code},'*');
      setTimeout(()=>window.close(),500);
    }else{
      setStatus('Ayara POS window is not available. Keep this code: '+code,true);
    }
  }catch(e){
    setStatus('Could not return the scanned value to Ayara POS. Code: '+code,true);
  }
}

function stopCamera(){
  if(scanner){
    scanner.stop().catch(()=>{}).then(()=>{try{scanner.clear()}catch(e){}});
    scanner=null;
  }
}

function startCamera(){
  sending=false;
  stopCamera();
  document.getElementById('result').style.display='none';
  setStatus('Starting camera… Please allow camera access.');
  scanner=new Html5Qrcode('reader');

  const config={
    fps:10,
    qrbox:function(w,h){
      const size=Math.min(Math.floor(w*.78),Math.floor(h*.55),320);
      return {width:size,height:size};
    }
  };

  scanner.start(
    {facingMode:'environment'},
    config,
    function(decodedText){
      sendCode(decodedText);
      stopCamera();
    },
    function(){ }
  ).then(()=>{
    setStatus('Camera ready. Point it at the QR code or barcode.');
  }).catch(err=>{
    console.error(err);
    setStatus('Camera could not start. Check browser Camera permission, HTTPS, and that no other app is using the camera.',true);
  });
}

window.addEventListener('load',startCamera);
window.addEventListener('beforeunload',stopCamera);
